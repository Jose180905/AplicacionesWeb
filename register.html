<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Dashboard Lite</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/app.js"></script>
</head>
<body>
    <div class="wrapper">
        <div class="card">
        <h2>Crear Cuenta</h2>
        <p class="subtitle">Únete al panel de control</p>
        <form id="registerForm">
            <input type="text" id="newName" placeholder="Nombre completo" required>
            <input type="email" id="newEmail" placeholder="Correo" required>
            <input type="text" id="newItsonId" placeholder="ID ITSON" required>
            <input type="password" id="newPass" placeholder="Contraseña" required>
            <button type="submit">Registrar</button>
        </form>

        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </div>
</body>
</html>
