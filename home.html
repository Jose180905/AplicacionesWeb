<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Proyectos</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/home.js"></script>

</head>
<body>

    <div class="wrapper">
        <div class="card" style="max-width: 700px; text-align: left;">

            <h2>Panel de Proyectos</h2>

            <button id="logoutBtn" style="background:#e74c3c; width:auto; margin-bottom: 1rem;">
                Cerrar sesión
            </button>

            <button id="showFormBtn" style="width:auto; margin-bottom:1rem;">
                Agregar proyecto
            </button>

            <div id="projectForm" style="display:none; margin-bottom: 1rem;">
                <input type="text" id="projectTitle" placeholder="Título del proyecto">
                <input type="text" id="projectDesc" placeholder="Descripción">
                <input type="text" id="projectTech" placeholder="Tecnologías separadas por coma">
                <input type="text" id="projectRepo" placeholder="Repositorio GitHub">
                <button id="saveProjectBtn">Guardar</button>
            </div>

            <h3 style="color:#2c3e50;">Proyectos Registrados</h3>

            <div id="projectsList"></div>

        </div>
    </div>

</body>
</html>
