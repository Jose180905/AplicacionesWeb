<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Dashboard Lite</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/app.js"></script>
</head>
<body>
    <div class="wrapper">
        <div class="card">
        <h2>Bienvenido</h2>
        <p class="subtitle">Inicia sesión para continuar</p>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Correo" required>
                <input type="password" id="loginPass" placeholder="Contraseña" required>
                <button type="submit">Entrar</button>
            </form>

        <p>¿No tienes cuenta? <a href="register.html">Crear cuenta</a></p>
        </div>
    </div>
</body>
</html>
